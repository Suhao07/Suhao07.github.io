media:
  input: blog-vue/blog/public/uploads
  output: /uploads
  rename: safe
  categories: [image]

content:
  - name: posts
    label: 博客文章
    type: collection
    path: content/posts
    subfolders: true
    filename: "{fields.slug}.md"
    view:
      layout: tree
      fields: [title, category, date, published]
      primary: title
      sort: [date, title]
      search: [title, summary, category, tags, body]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: slug
        label: 文章网址
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "请只使用小写英文字母、数字和连字符"
        description: "例如：my-first-post；发布后尽量不要修改"
      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          format: "yyyy-MM-dd"
      - name: updated
        label: 更新日期
        type: date
        options:
          format: "yyyy-MM-dd"
      - name: category
        label: 分类
        type: string
        required: true
      - name: tags
        label: 标签
        type: string
        description: "多个标签使用英文或中文逗号分隔"
      - name: summary
        label: 摘要
        type: text
        description: "留空时会自动提取正文开头"
      - name: cover
        label: 封面
        type: image
      - name: top
        label: 首页置顶
        type: boolean
      - name: published
        label: 已发布
        type: boolean
        required: true
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

  - name: site
    label: 网站设置
    type: file
    path: content/site.json
    operations:
      delete: false
    fields:
      - name: title
        label: 网站标题
        type: string
        required: true
      - name: nickname
        label: 昵称
        type: string
        required: true
      - name: intro
        label: 简介
        type: text
        required: true
      - name: announcement
        label: 公告
        type: rich-text
        options:
          format: markdown
          switcher: true
      - name: avatar
        label: 头像
        type: image
      - name: github
        label: GitHub 地址
        type: string
      - name: url
        label: 网站地址
        type: string
        description: "购买域名后改成 https://你的域名"
      - name: startDate
        label: 建站日期
        type: date
        options:
          format: "yyyy-MM-dd"

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content: 新建 {primary}"
      update: "content: 更新 {primary}"
      delete: "content: 删除 {primary}"
